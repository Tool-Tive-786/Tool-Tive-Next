name: CF Pages Debug
on:
  push:
    paths:
      - ".github/workflows/cf-debug.yml"
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable corepack (yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Build with next-on-pages
        run: yarn pages:build

      - name: Prepare isolated site dir (no wrangler.toml, so CLI flags apply)
        run: |
          mkdir -p repro
          cp -r .vercel/output/static repro/site

      - name: Probe A — as-is (compat date 2024-09-01)
        run: |
          cd repro
          npx wrangler pages dev site --port 8788 --compatibility-date=2024-09-01 --compatibility-flags=nodejs_compat > wrangler-as-is.log 2>&1 &
          for i in $(seq 1 15); do curl -s -o /dev/null http://localhost:8788/ && break; sleep 2; done
          echo "=== GET /api/robots-txt/fetch ==="
          curl -s -w "\nHTTP %{http_code}\n" http://localhost:8788/api/robots-txt/fetch || true
          sleep 4
          echo "=== POST missing url ==="
          curl -s -w "\nHTTP %{http_code}\n" -X POST http://localhost:8788/api/robots-txt/fetch -H "Content-Type: application/json" -d '{}' || true
          sleep 4
          echo "=== full wrangler log ==="
          cat wrangler-as-is.log

      - name: Probe B — compat date 2025-03-01 (nodejs_compat v2)
        run: |
          cd repro
          npx wrangler pages dev site --port 8789 --compatibility-date=2025-03-01 --compatibility-flags=nodejs_compat > wrangler-v2.log 2>&1 &
          for i in $(seq 1 15); do curl -s -o /dev/null http://localhost:8789/ && break; sleep 2; done
          echo "=== GET /api/robots-txt/fetch ==="
          curl -s -w "\nHTTP %{http_code}\n" http://localhost:8789/api/robots-txt/fetch || true
          sleep 4
          echo "=== POST missing url ==="
          curl -s -w "\nHTTP %{http_code}\n" -X POST http://localhost:8789/api/robots-txt/fetch -H "Content-Type: application/json" -d '{}' || true
          sleep 4
          echo "=== POST valid localhost ssrf ==="
          curl -s -w "\nHTTP %{http_code}\n" -X POST http://localhost:8789/api/robots-txt/fetch -H "Content-Type: application/json" -d '{"url":"http://127.0.0.1/robots.txt"}' || true
          sleep 4
          echo "=== POST valid https tooltive (live fetch) ==="
          curl -s -w "\nHTTP %{http_code}\n" -X POST http://localhost:8789/api/robots-txt/fetch -H "Content-Type: application/json" -d '{"url":"https://tooltive.com"}' || true
          sleep 4
          echo "=== full wrangler log ==="
          cat wrangler-v2.log
